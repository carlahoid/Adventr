<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  An author or reactor: avatar (initials for former members), name, and the "(former member)"
  label. Use with an app.adventr.group.Author.
*/-->
<span class="author" th:fragment="author(author)"><th:block
		th:replace="~{fragments/avatar :: avatar(${author.userId}, ${author.displayName}, ${author.showsAvatar() ? author.avatarVersion : null}, 'xs')}"></th:block><span
		class="author-name" th:text="${author.displayName}">Alex</span><span
		class="former-member" th:if="${author.formerMember}"> (former member)</span></span>
</body>
</html>
