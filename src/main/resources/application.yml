spring:
  application:
    name: adventr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adventr}
    username: ${DB_USERNAME:adventr}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:adventr-app}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
        provider:
          keycloak:
            # Public issuer URL, e.g. https://adventr.duckdns.org/auth/realms/adventr.
            # Discovery happens at startup, so Keycloak must be healthy before the app starts.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/auth/realms/adventr}
            user-name-attribute: sub

server:
  # Trust X-Forwarded-* from Caddy (private network ranges only), so redirect URIs use the public https URL.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
