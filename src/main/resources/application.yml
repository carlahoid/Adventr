spring:
  application:
    name: adventr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adventr}
    username: ${DB_USERNAME:adventr}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  servlet:
    multipart:
      # Above the 10 MB image limit, so that a too-large image gets a clear message from the
      # app (AdventureImages) instead of a failed request. Bigger requests are refused outright.
      max-file-size: 25MB
      max-request-size: 26MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:adventr-app}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
        provider:
          keycloak:
            # Public issuer URL, e.g. https://adventr.duckdns.org/auth/realms/adventr.
            # Discovery happens at startup, so Keycloak must be healthy before the app starts.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/auth/realms/adventr}
            user-name-attribute: sub

adventr:
  images:
    # Uploaded images; a Docker volume in production. Never served statically.
    dir: ${IMAGES_DIR:/data/images}

server:
  # Trust X-Forwarded-* from Caddy (private network ranges only), so redirect URIs use the public https URL.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax
  tomcat:
    # Read (and discard) oversized uploads up to this size, so the browser gets our error page
    # instead of a reset connection.
    max-swallow-size: 30MB
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
